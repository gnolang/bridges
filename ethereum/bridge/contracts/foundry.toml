# The Ethereum side of the gno.land <-> Ethereum bridge (eth/bridge/PLAN.md §5.8, §6): our three contracts beside
# Hyperlane 12.2.0's Mailbox, HypERC20, MerkleTreeHook and ProtocolFee and OpenZeppelin 4.9.3's proxies, compiled
# the way Hyperlane's release is (solc 0.8.33, cancun, the optimizer at 10,000 runs). Build on the devbox, never on
# the Mac (BUILD.md). The clock factor is a compile-time constant chosen by the profile: `default` is the mainnet
# build (1); `FOUNDRY_PROFILE=factor8` is the devnet/Sepolia build (8): 7 days in 21 hours (PLAN.md §5.9).

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
auto_detect_remappings = false
remappings = [
    "@hyperlane-xyz/core/=lib/hyperlane-core/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
    "bridge-clock/=src/clock/factor1/",
]
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["GnoLightClient", "PausableGate", "HlAdmin", "Mailbox", "HypERC20"]
# The suite runs whole deliveries and the setup's eleven steps: plenty of gas per test.
gas_limit = 9223372036854775807
block_gas_limit = 9223372036854775807

[profile.default.fuzz]
runs = 512
seed = "0x6e6f6c616e64"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.factor8]
remappings = [
    "@hyperlane-xyz/core/=lib/hyperlane-core/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
    "bridge-clock/=src/clock/factor8/",
]

[lint]
# forge lint runs on its own (`forge lint`); a build prints only the compiler's word.
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
ignore = ["lib/**"]
