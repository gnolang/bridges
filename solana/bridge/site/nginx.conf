# bridge.gno.world: the bridge's site, served by hlsite on the loopback (bridge/SITE.md).
#
# Port 80 only, on purpose: certbot --nginx adds the :443 server, the cert lines and the redirect by rewriting
# this file in place — which is why deploy.sh installs it only when it is not there yet, and never edits the
# symlink in sites-enabled. The security headers (the CSP among them) are hlsite's own, on every response.

server {
    listen 80;
    listen [::]:80;
    server_name bridge.gno.world;

    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8195; # 8095 is the meet gate's on the kourt box
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
