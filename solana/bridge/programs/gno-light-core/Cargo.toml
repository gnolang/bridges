[package]
name = "gno-light-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "gno.land header hashing, sign bytes, validator sets, merkle proofs and results leaves: pure logic, no Solana"

[features]
# testkit: synthetic headers, commits, validator keys and Dispatch leaves signed with ed25519-dalek (tests only).
testkit = ["dep:ed25519-dalek", "dep:sha2", "dep:rand"]
# fixtures: the loader of ../fixtures/*.json, gnoland-1's own RPC answers (tests only).
fixtures = ["dep:serde_json", "dep:base64", "dep:hex", "dep:sha2"]

[dependencies]
borsh.workspace = true
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
ed25519-dalek.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
